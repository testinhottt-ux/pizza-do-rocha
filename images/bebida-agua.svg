<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aguaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7ff;stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:#b3e5fc;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#81d4fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aguaShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9" />
      <stop offset="40%" style="stop-color:#fff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
    </linearGradient>
    <filter id="shadowAgua" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="8" stdDeviation="5" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Sombra base -->
  <ellipse cx="150" cy="360" rx="90" ry="20" fill="#0277bd" opacity="0.1"/>
  
  <!-- Tampa branca -->
  <rect x="115" y="15" width="70" height="12" rx="3" fill="#fff" filter="url(#shadowAgua)"/>
  <rect x="112" y="25" width="76" height="6" rx="2" fill="#eceff1"/>
  
  <!-- Garrafa cristal -->
  <path d="M 110 35 Q 100 70 100 150 Q 100 200 120 280 Q 120 320 150 330 Q 180 320 180 280 Q 200 200 200 150 Q 200 70 190 35 Z" 
        fill="url(#aguaGrad)" filter="url(#shadowAgua)" stroke="#4fc3f7" stroke-width="0.5" opacity="0.95"/>
  
  <!-- Brilho cristalino esquerdo -->
  <path d="M 112 40 Q 115 110 115 180 Q 115 250 117 310" 
        fill="none" stroke="url(#aguaShine)" stroke-width="11" opacity="0.8"/>
  
  <!-- Pequeno brilho direito -->
  <path d="M 188 50 Q 186 140 185 240" 
        fill="none" stroke="#fff" stroke-width="5" opacity="0.4"/>
  
  <!-- Logo/Marca da água -->
  <circle cx="150" cy="160" r="32" fill="#00bcd4" opacity="0.05"/>
  <text x="150" y="168" text-anchor="middle" font-size="14" font-weight="300" fill="#0277bd" opacity="0.25">MINERAL</text>
  
  <!-- Bolhas de ar (pureza) -->
  <circle cx="125" cy="120" r="2.5" fill="#fff" opacity="0.7"/>
  <circle cx="135" cy="180" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="165" cy="150" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="128" cy="240" r="1.5" fill="#fff" opacity="0.45"/>
  
  <!-- Reflexos de pureza -->
  <ellipse cx="132" cy="80" rx="7" ry="24" fill="#fff" opacity="0.55"/>
  <ellipse cx="178" cy="220" rx="5" ry="16" fill="#fff" opacity="0.32"/>
</svg>
