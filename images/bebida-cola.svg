<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="colaBottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2f1f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b21e14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b1610;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="colaShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b5a;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ff6b5a;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ff6b5a;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Sombra base -->
  <ellipse cx="150" cy="360" rx="90" ry="20" fill="#000" opacity="0.15"/>
  
  <!-- Tampa -->
  <rect x="115" y="15" width="70" height="12" rx="3" fill="#d4af37" filter="url(#shadow)"/>
  <rect x="112" y="25" width="76" height="6" rx="2" fill="#b8860b"/>
  
  <!-- Garrafa -->
  <path d="M 110 35 Q 100 70 100 150 Q 100 200 120 280 Q 120 320 150 330 Q 180 320 180 280 Q 200 200 200 150 Q 200 70 190 35 Z" 
        fill="url(#colaBottleGrad)" filter="url(#shadow)" stroke="#5c0f08" stroke-width="1"/>
  
  <!-- Brilho esquerdo -->
  <path d="M 115 40 Q 118 100 118 150 Q 118 200 120 270" 
        fill="none" stroke="url(#colaShine)" stroke-width="12" opacity="0.6"/>
  
  <!-- Marca/Logo -->
  <circle cx="150" cy="160" r="35" fill="#fff" opacity="0.05"/>
  <text x="150" y="165" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff" opacity="0.3">COLA</text>
  
  <!-- Reflexo vidro -->
  <ellipse cx="130" cy="90" rx="8" ry="20" fill="#fff" opacity="0.4"/>
  <ellipse cx="175" cy="200" rx="6" ry="15" fill="#fff" opacity="0.25"/>
  
  <!-- Líquido condensado -->
  <circle cx="110" cy="70" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="112" cy="95" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="108" cy="130" r="1.5" fill="#fff" opacity="0.5"/>
</svg>
